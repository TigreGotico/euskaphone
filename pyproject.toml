[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euskaphone"
dynamic = ["version"]
description = "Dialect-aware Basque (Euskara) text-to-IPA phonemizer over the orthography2ipa lattice"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["basque", "euskara", "phonemizer", "g2p", "ipa", "phonetics", "tts", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Basque",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "linguatag>=0.4.2a4",
    "orthography2ipa>=7.122.0a2",
    # BasqueNumberParser spells numbers with it: the fallbacks for the forms
    # that text2spoken leaves as written, and the deprecated number stage.
    "ovos-number-parser>=0.6.0a1",
    # Reads numbers, dates, abbreviations, Roman numerals and units.
    "text2spoken[eu]>=0.0.2a81",
]

[project.optional-dependencies]
# Statistical char-Markov code-switch detector. Optional: without it, the
# orthographic heuristic is used. The bundled models are scored by markovonnx.
langdetect = [
    "markovonnx>=1.0.1",
]
test = [
    "pytest",
    "pytest-cov",
    "markovonnx>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/euskaphone"
Repository = "https://github.com/TigreGotico/euskaphone"

[tool.setuptools]
packages = ["euskaphone"]

[tool.setuptools.package-data]
euskaphone = ["data/langdetect/*.json.gz", "data/**/*.tsv", "data/*.tsv"]

[tool.setuptools.dynamic]
version = { attr = "euskaphone.version.__version__" }
